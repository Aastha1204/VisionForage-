services:
  - type: web
    name: visionforge
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && cd ../frontend && npm install && npm run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
